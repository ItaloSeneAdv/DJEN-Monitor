name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Install and test
        run: |
          python -m pip install -e . pytest "pyinstaller>=6,<7"
          python -m pytest
          python -m compileall -q src tests launcher.py tools
          python tools/windows_scheduler_smoke.py
      - name: Build Windows executable and smoke-test it
        shell: pwsh
        run: |
          pyinstaller --clean --onefile --noconsole --name "DJEN Monitor" --version-file "windows/version_info.txt" --collect-all openpyxl --collect-all tzdata --collect-all certifi launcher.py
          $p = Start-Process -FilePath "dist/DJEN Monitor.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test do executavel falhou: $($p.ExitCode)" }
          $p = Start-Process -FilePath "dist/DJEN Monitor.exe" -ArgumentList "--self-test-stable-copy" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test da copia agendada falhou: $($p.ExitCode)" }
          $p = Start-Process -FilePath "dist/DJEN Monitor.exe" -ArgumentList "--self-test-console" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test do console falhou: $($p.ExitCode)" }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist/DJEN Monitor.exe" "release/DJEN Monitor.exe"
          Copy-Item "windows/LEIA-ME.txt" "release/LEIA-ME.txt"
          Copy-Item "windows/REMOVER_DADOS.bat" "release/REMOVER_DADOS.bat"
          Compress-Archive -Path "release/*" -DestinationPath "DJEN-Monitor-Windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: DJEN-Monitor-Windows-x64
          path: DJEN-Monitor-Windows-x64.zip

  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -e . pytest "pyinstaller>=6,<7"
          python -m pytest
          python -m compileall -q src tests launcher.py
          bash -n macos/ABRIR_DJEN_MONITOR.command
          bash -n macos/REMOVER_DADOS.command
      - name: Build Intel executable
        run: |
          test "$(uname -m)" = "x86_64"
          pyinstaller --clean --onefile --console --name "DJEN Monitor" --collect-all openpyxl --collect-all tzdata --collect-all certifi launcher.py
          ./dist/DJEN\ Monitor --self-test
          file "dist/DJEN Monitor" | grep -q "x86_64"
          codesign --force --sign - "dist/DJEN Monitor"
          codesign --verify --verbose "dist/DJEN Monitor"
          mkdir -p release-mac
          cp "dist/DJEN Monitor" release-mac/
          cp macos/ABRIR_DJEN_MONITOR.command macos/REMOVER_DADOS.command macos/LEIA-ME.txt release-mac/
          chmod +x "release-mac/DJEN Monitor" release-mac/*.command
          ditto -c -k --sequesterRsrc release-mac DJEN-Monitor-macOS-Intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DJEN-Monitor-macOS-Intel
          path: DJEN-Monitor-macOS-Intel.zip

  macos-apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -e . pytest "pyinstaller>=6,<7"
          python -m pytest
          python -m compileall -q src tests launcher.py
          bash -n macos/ABRIR_DJEN_MONITOR.command
          bash -n macos/REMOVER_DADOS.command
      - name: Build Apple Silicon executable
        run: |
          test "$(uname -m)" = "arm64"
          pyinstaller --clean --onefile --console --name "DJEN Monitor" --collect-all openpyxl --collect-all tzdata --collect-all certifi launcher.py
          ./dist/DJEN\ Monitor --self-test
          file "dist/DJEN Monitor" | grep -q "arm64"
          codesign --force --sign - "dist/DJEN Monitor"
          codesign --verify --verbose "dist/DJEN Monitor"
          mkdir -p release-mac
          cp "dist/DJEN Monitor" release-mac/
          cp macos/ABRIR_DJEN_MONITOR.command macos/REMOVER_DADOS.command macos/LEIA-ME.txt release-mac/
          chmod +x "release-mac/DJEN Monitor" release-mac/*.command
          ditto -c -k --sequesterRsrc release-mac DJEN-Monitor-macOS-Apple-Silicon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DJEN-Monitor-macOS-Apple-Silicon
          path: DJEN-Monitor-macOS-Apple-Silicon.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos-intel, macos-apple-silicon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DJEN-Monitor-Windows-x64
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: DJEN-Monitor-macOS-Intel
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: DJEN-Monitor-macOS-Apple-Silicon
          path: release-assets
      - name: Verify release assets
        run: |
          test -f release-assets/DJEN-Monitor-Windows-x64.zip
          test -f release-assets/DJEN-Monitor-macOS-Intel.zip
          test -f release-assets/DJEN-Monitor-macOS-Apple-Silicon.zip
          sha256sum release-assets/*.zip
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true
