name: CI Windows

on:
  push:
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Install
        run: python -m pip install -e . pytest "pyinstaller>=6,<7"
      - name: Compile Python
        run: python -m compileall -q src tests launcher.py tools
      - name: Unit and integration tests
        run: python -m pytest
      - name: Smoke-test Windows Task Scheduler registration
        run: python tools/windows_scheduler_smoke.py
      - name: Build and execute the real Windows EXE
        run: python tools/build_smoke.py
